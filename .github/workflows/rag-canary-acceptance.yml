name: RAG Canary Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/rag-canary-acceptance.yml"
      - "jchatmind/**"
      - "rag-mcp/**"
      - "scripts/verify_rag_canary.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rag-canary-acceptance.yml"
      - "jchatmind/**"
      - "rag-mcp/**"
      - "scripts/verify_rag_canary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Maven wrapper
        run: chmod +x jchatmind/mvnw

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e rag-mcp

      - name: Run RAG canary verification
        run: |
          python scripts/verify_rag_canary.py \
            --acceptance-rounds 3 \
            --acceptance-output-json rag-mcp/output/metrics/ci_canary_acceptance.json \
            --report-json rag-mcp/output/metrics/ci_rag_canary_verification.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-canary-verification
          path: |
            rag-mcp/output/metrics/ci_canary_acceptance.json
            rag-mcp/output/metrics/ci_rag_canary_verification.json
          if-no-files-found: ignore
