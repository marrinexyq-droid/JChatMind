[project]
name = "rag-mcp"
version = "1.0.0"
description = "Python MCP RAG replacement subsystem for JChatMind"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
chroma = [
  "chromadb>=0.5,<1.0",
]
dashboard = [
  "streamlit>=1.36",
]
eval = [
  "ragas==0.4.3",
  "langchain-community==0.3.31",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
