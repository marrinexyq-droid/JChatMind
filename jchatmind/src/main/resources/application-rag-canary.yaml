spring:
  config:
    activate:
      on-profile: rag-canary

management:
  endpoint:
    health:
      show-details: always

rag:
  python-bridge:
    enabled: true
    ingestion-enabled: true
    readiness-gate-enabled: true
    readiness-cache-ttl-ms: 15000
    canary-preflight-enabled: true
    canary-preflight-fail-on-error: true
    canary-preflight-timeout-ms: 30000
    canary-preflight-collection: java-rag-canary
    fallback-on-error: false
    fallback-on-empty: false
    fail-on-ingestion-error: true
