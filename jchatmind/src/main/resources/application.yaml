spring:
  application:
    name: jchatmind
  datasource:
    url: jdbc:postgresql://localhost:5432/jchatmind
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.qq.com
    port: 587
    username: 1598826374@qq.com
    password: ${MAIL_PASSWORD:wkjydaedaibbfdja}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-2188cc99eb2e4ecc8558462784667ede}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:3a14463a544f4c80844dd18a563a9d8b.bo4YX6sBjstlHwoD}
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6v
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        model: ${GOOGLE_GENAI_MODEL:gemini-2.5-flash}
        temperature: ${GOOGLE_GENAI_TEMPERATURE:0.7}
        max-output-tokens: ${GOOGLE_GENAI_MAX_OUTPUT_TOKENS:2048}
        timeout-millis: ${GOOGLE_GENAI_TIMEOUT_MILLIS:30000}
mybatis:
  type-aliases-package: com.marrine.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.marrine.jchatmind.typehandler

document:
  storage:
    base-path: ./data/documents

reranker:
  base-url: http://127.0.0.1:8001

rag:
  python-bridge:
    enabled: false
    ingestion-enabled: false
    project-root: ../rag-mcp
    python-executable: python
    python-args: []
    timeout-ms: 8000
    ingestion-timeout-ms: 30000
    readiness-gate-enabled: false
    readiness-cache-ttl-ms: 15000
    canary-preflight-enabled: false
    canary-preflight-fail-on-error: false
    canary-preflight-timeout-ms: 30000
    canary-preflight-collection: java-rag-canary
    fallback-on-error: true
    fallback-on-empty: true
    fail-on-ingestion-error: false
  self-rag:
    enabled: true
    min-final-chunks: 2
    max-retries: 1
  strategy:
    types:
      FACT:
        mode: hybrid
        top-k: 5
        candidate-pool-size: 20
        vector-weight: 1.0
        bm25-weight: 1.0
        graph-expansion-enabled: false
        graph-max-hops: 1
      SUMMARY:
        mode: hybrid
        top-k: 10
        candidate-pool-size: 40
        vector-weight: 1.0
        bm25-weight: 1.0
        graph-expansion-enabled: false
        graph-max-hops: 1
      COMPARISON:
        mode: hybrid-rerank
        top-k: 8
        candidate-pool-size: 30
        vector-weight: 1.0
        bm25-weight: 1.2
        graph-expansion-enabled: false
        graph-max-hops: 1
      MULTI_HOP:
        mode: hybrid-rerank
        top-k: 8
        candidate-pool-size: 40
        vector-weight: 1.0
        bm25-weight: 1.2
        graph-expansion-enabled: true
        graph-max-hops: 2
